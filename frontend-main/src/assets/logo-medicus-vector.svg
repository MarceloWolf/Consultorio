<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 70" width="100%" height="100%">
  <defs>
    <!-- Premium Teal/Cyan Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Isotipo (Stylized Tooth + Leaf/Shield shape) -->
  <g transform="translate(10, 5)">
    <!-- Main Tooth Crest -->
    <path d="M25 5C17 5 12 11 12 20C12 32 23 48 25 58C27 48 38 32 38 20C38 11 33 5 25 5ZM25 35C21.7 35 19 32.3 19 29C19 25.7 21.7 23 25 23C28.3 23 31 25.7 31 29C31 32.3 28.3 35 25 35Z" fill="url(#logoGrad)" filter="url(#glow)"/>
    <!-- Outer accent rings -->
    <path d="M25 2C13.5 2 6 9.5 6 20C6 36 21.5 53.5 25 61.5C28.5 53.5 44 36 44 20C44 9.5 36.5 2 25 2ZM25 55C22 47.5 10 32 10 20C10 11.5 16 6 25 6C34 6 40 11.5 40 20C40 32 28 47.5 25 55Z" fill="url(#logoGrad)" opacity="0.6"/>
  </g>

  <!-- Logo Typography -->
  <g transform="translate(75, 12)">
    <!-- Main Doctor Title -->
    <text x="0" y="22" font-family="'Outfit', 'Inter', sans-serif" font-size="22" font-weight="800" fill="currentColor" letter-spacing="0.5">
      Dr. Pablo Wolf
    </text>
    <!-- Secondary Service Title -->
    <text x="0" y="40" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#14b8a6" letter-spacing="4">
      CENTRO ODONTOLÓGICO
    </text>
  </g>
</svg>

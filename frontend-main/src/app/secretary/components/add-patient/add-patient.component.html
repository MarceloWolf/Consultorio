<!-- add-patient-modal.component.html -->
<div class="modal-backdrop fade show"></div>
<div class="modal fade show d-block">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Nuevo Paciente</h5>
        <button type="button" class="btn-close btn-close-white" (click)="close()"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="addForm" (ngSubmit)="onSubmit()" class="row g-3">
          <!-- DNI -->
          <div class="col-md-6">
            <label class="form-label">DNI<span class="text-danger">*</span></label>
            <input 
              type="text" 
              class="form-control" 
              formControlName="dni" 
              placeholder="Ej: 12345678 (7 u 8 dígitos)"
              (blur)="checkDniDuplicate()"
            >
            <div *ngIf="addForm.get('dni')?.invalid && (submitted || addForm.get('dni')?.touched)"
                 class="text-danger">
              <small *ngIf="addForm.get('dni')?.hasError('required')">Campo requerido</small>
              <small *ngIf="addForm.get('dni')?.hasError('pattern')">Formato inválido (7-8 dígitos)</small>
              <small *ngIf="addForm.get('dni')?.hasError('duplicated')">El DNI ingresado ya pertenece a un paciente registrado</small>
            </div>
          </div>

          <!-- Nombre -->
          <div class="col-md-6">
            <label class="form-label">Nombre<span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="name" placeholder="Ej: Juan">
            <div *ngIf="addForm.get('name')?.invalid && (submitted || addForm.get('name')?.touched)"
                 class="text-danger">
              <small>Campo requerido</small>
            </div>
          </div>

          <!-- Apellido -->
          <div class="col-md-6">
            <label class="form-label">Apellido<span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="lastname" placeholder="Ej: Pérez">
            <div *ngIf="addForm.get('lastname')?.invalid && (submitted || addForm.get('lastname')?.touched)"
                 class="text-danger">
              <small>Campo requerido</small>
            </div>
          </div>

          <!-- Email -->
          <div class="col-md-6">
            <label class="form-label">Email<span class="text-danger">*</span></label>
            <input type="email" class="form-control" formControlName="email" placeholder="Ej: juan@example.com">
            <div *ngIf="addForm.get('email')?.invalid && (submitted || addForm.get('email')?.touched)"
                 class="text-danger">
              <small *ngIf="addForm.get('email')?.hasError('required')">Campo requerido</small>
              <small *ngIf="addForm.get('email')?.hasError('email')">Formato de email inválido</small>
            </div>
          </div>

          <!-- Teléfono -->
          <div class="col-md-6">
            <label class="form-label">Teléfono<span class="text-danger">*</span></label>
            <input type="tel" class="form-control" formControlName="phoneNumber" placeholder="Ej: +541112345678">
            <div *ngIf="addForm.get('phoneNumber')?.invalid && (submitted || addForm.get('phoneNumber')?.touched)"
                 class="text-danger">
              <small>Campo requerido</small>
            </div>
          </div>

          <!-- Fecha Nacimiento -->
          <div class="col-md-6">
            <label class="form-label">Fecha Nacimiento<span class="text-danger">*</span></label>
            <input type="date" class="form-control" formControlName="birthdate">
            <div *ngIf="addForm.get('birthdate')?.invalid && (submitted || addForm.get('birthdate')?.touched)"
                 class="text-danger">
              <small>Campo requerido</small>
            </div>
          </div>

          <!-- Dirección -->
          <div class="col-12">
            <label class="form-label">Dirección<span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="address" placeholder="Ej: Calle Falsa 123">
            <div *ngIf="addForm.get('address')?.invalid && (submitted || addForm.get('address')?.touched)"
                 class="text-danger">
              <small>Campo requerido</small>
            </div>
          </div>

          <!-- Mensaje de error general -->
          <div *ngIf="errorMessage" class="col-12 text-center text-danger">
            <small>{{ errorMessage }}</small>
          </div>

          <div class="modal-footer border-0">
            <button type="button" class="btn btn-secondary" (click)="close()">Cancelar</button>
            <button type="submit" class="btn btn-primary">
              <span class="material-icons align-middle">save</span> Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

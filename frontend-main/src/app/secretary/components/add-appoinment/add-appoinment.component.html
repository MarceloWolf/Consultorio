<div class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h4>Agregar Nuevo Turno</h4>
            <button class="close-btn" (click)="clearShift()">&times;</button>
        </div>

        <form [formGroup]="appointmentForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label>DNI del Paciente</label>
                <input type="text" 
                    formControlName="patientDni" 
                    class="form-control"
                    [disabled]="true"
                    [class.is-invalid]="appointmentForm.get('patientDni')?.invalid">
            </div>
            

            <div class="form-group">
                <label>Especialidad</label>
                <select formControlName="speciality" class="form-control" (change)="onSpecialityChange()">
                    <option value="" disabled selected>Seleccione una especialidad</option>
                    <option *ngFor="let spec of specialities" [value]="spec.name">{{ spec.name }}</option>
                </select>
            </div>

            <div class="form-group">
                <label>Profesional</label>
                <select formControlName="professional" class="form-control" (change)="onProfessionalChange()" [disabled]="!professionals.length">
                    <option value="" >Seleccione un profesional</option>
                    <option *ngFor="let prof of professionals" [value]="prof.dni">
                        {{ prof.name }} {{ prof.lastname }}
                    </option>
                </select>
            </div>
            <div *ngIf="selectedShift">
                <p><strong>Turno seleccionado:</strong> {{ selectedShift.date }} - {{ selectedShift.time }}</p>
            </div>


            <!-- Modal de selección de turno -->
            <div *ngIf="isShiftModalVisible" class="modal">
                <div class="modal-content">
                  <h4>Seleccione un turno</h4>
                  
                  <div class="week-group" *ngFor="let week of availableShiftsByWeek">
                    <h5>{{ week.weekLabel }}</h5>
                    <ul class="list-group">
                        <li class="list-group-item" 
                            *ngFor="let shift of week.shifts" 
                            (click)="selectShift(shift)"
                            [class.selected]="selectedShift && selectedShift.date === shift.date && selectedShift.time === shift.time">
                            {{ shift.date | date:'dd/MM/yyyy' }} - {{ shift.time }}
                        </li>
                    </ul>
                  </div>
              
                  <div *ngIf="availableShiftsByWeek.length === 0" class="alert alert-info">
                    No hay turnos disponibles
                  </div>
              
                  <div class="modal-actions">
                    <button type="button" class="btn btn-secondary m-1" (click)="clearShift()">Cancelar</button>
                    <button type="button" class="btn btn-primary m-1" (click)="saveShift()">Guardar</button>
                  </div>
                </div>
            </div>


            <div class="modal-footer">
                <button type="button" 
                    class="btn btn-secondary cancel-btn" 
                    (click)="clearShift()"> <!-- Eliminar el click directo -->
                    Cancelar
                </button>

                <button type="submit" class="btn btn-primary" [disabled]="!appointmentForm.valid || !selectedShift">Guardar</button>
            </div>
        </form>
    </div>
</div>

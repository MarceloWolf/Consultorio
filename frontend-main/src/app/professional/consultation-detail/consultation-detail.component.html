
<h2 class="dialog-title">
    Detalle completo de la consulta
    <button type="button" class="btn-close btn-close-white" (click)="dialogRef.close()"></button>
</h2>

  
<mat-dialog-content class="p-4">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="fw-bold">Fecha de la Consulta:</label>
            <p>{{ data.date | date:'dd/MM/yyyy' }}</p>
        </div>
        <div class="col-md-6 mb-3">
            <label class="fw-bold">Hora de la Consulta:</label>
            <p>{{ data.time | slice:0:5 }}</p>
        </div>
            
        <div class="col-md-6 mb-3">
            <label class="fw-bold">Especialidad:</label>
            <p>{{ data.specialityName }}</p>
        </div>
            
        <div class="col-12 mb-3">
            <label class="fw-bold">Razón de la consulta:</label>
            <p class="bg-light p-3 rounded">{{ data.reason || 'Sin observaciones' }}</p>
        </div>
            
        <div class="col-12 mb-3">
            <label class="fw-bold">Diagnóstico:</label>
            <p class="bg-light p-3 rounded">{{ data.diagnosis || 'N/A' }}</p>
        </div>
            
        <div class="col-12 mb-3">
            <label class="fw-bold">Tratamiento indicado:</label>
            <p class="bg-light p-3 rounded">{{ data.treatment || 'N/A' }}</p>
        </div>
            
    </div>
</mat-dialog-content>
